apiVersion: v1
kind: Service
metadata:
  name: task01-ns
spec:
  ports:
    - name: http
      protocol: TCP
      port: 9001
      nodePort: 32001
      targetPort: 80
    - name: http-multitool
      protocol: TCP
      port: 9002
      nodePort: 32002
      targetPort: 8080
  selector:
    app: task01
  type: NodePort